<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laiteinfo</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin: 12px auto;
  max-width: 450px;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<h1>📱 Laiteinfo</h1>
<p>Tämä sivu näyttää selaimesi perustiedot.</p>
<div class="card" id="info">Ladataan tietoja...</div>

<script>
const info = {
  "Käyttöjärjestelmä": navigator.userAgent,
  "Selain": navigator.appName,
  "Näyttö": screen.width + " × " + screen.height,
  "Kieli": navigator.language,
  "Aikavyöhyke": Intl.DateTimeFormat()
    .resolvedOptions().timeZone,
  "Avausaika": new Date().toLocaleString()
};

const container = document.getElementById("info");

for (const [key, value] of Object.entries(info)) {
  const p = document.createElement("p");
  const b = document.createElement("b");
  b.textContent = key + ": ";
  p.appendChild(b);
  p.appendChild(document.createTextNode(value));
  container.appendChild(p);
}
</script>
</body>
</html>
